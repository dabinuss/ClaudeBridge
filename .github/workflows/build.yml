name: Test and build ClaudeBridge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            platform: win32
          - os: ubuntu-latest
            label: Linux
            platform: linux
          - os: macos-latest
            label: macOS
            platform: darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check server/index.js
          node --check server/v2.js
          node --check server/db.js
          node --check server/worker.js
          node --check server/agent-mcp.js
          node --check server/watchdog.js
      - name: Run legacy smoke tests
        run: node tests/smoke.js
      - name: Run v2 smoke tests
        run: node tests/v2.js
      - name: Test two-agent mailbox
        run: node tests/mailbox.js
      - name: Bundle Codex CLI for this platform
        run: npm install --prefix vendor --no-audit --no-fund --no-save @openai/codex
      - name: Check bundled Codex CLI
        shell: bash
        run: node vendor/node_modules/@openai/codex/bin/codex.js --version
      - name: Set manifest platform
        shell: bash
        run: |
          node -e 'const fs=require("fs");const m=require("./manifest.json");m.compatibility.platforms=[process.argv[1]];fs.writeFileSync("manifest.json",JSON.stringify(m,null,2)+"\n")' ${{ matrix.platform }}
      - name: Bundle ClaudeBridge Extension
        shell: pwsh
        run: |
          Compress-Archive -Path manifest.json,server,vendor -DestinationPath "ClaudeBridge-${{ matrix.label }}.zip" -Force
          Rename-Item "ClaudeBridge-${{ matrix.label }}.zip" "ClaudeBridge-${{ matrix.label }}.mcpb"
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeBridge-${{ matrix.label }}
          path: ClaudeBridge-${{ matrix.label }}.mcpb
          if-no-files-found: error

  preview-release:
    concurrency:
      group: claudebridge-preview-deploy
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: ClaudeBridge-*
          merge-multiple: true
      - name: Remove obsolete non-platform preview asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete-asset preview ClaudeBridge.mcpb -y 2>/dev/null || true
      - name: Publish preview installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view preview >/dev/null 2>&1; then
            gh release upload preview ClaudeBridge-*.mcpb --clobber
          else
            gh release create preview ClaudeBridge-*.mcpb --target "$GITHUB_SHA" --title "ClaudeBridge Preview" --notes "Experimental cross-platform desktop extensions. Codex CLI is bundled. One-time ChatGPT sign-in remains required." --prerelease
          fi
