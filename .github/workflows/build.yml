name: Test and build ClaudeBridge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            platform: win32
          - os: ubuntu-latest
            label: Linux
            platform: linux
          - os: macos-latest
            label: macOS
            platform: darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check server/index.js
          node --check server/v2.js
          node --check server/db.js
          node --check server/worker.js
          node --check server/agent-mcp.js
          node --check server/watchdog.js
          node --check server/memory.js
          node --check server/memory-monitor.js
          node --check server/plans.js
          node --check server/settings.js
          node --check server/app-ui.js
          node --check integrations/picker.js
          node --check server/process-tree.js
          node --check ui/client.js
          node --check integrations/native-ui/renderer.js
          node --check integrations/native-ui/companion.js
          node --check integrations/native-ui/cdp.js
          node --check integrations/native-ui/setup-unix.js
          node --check maintenance/cleanup-unix.js
          node --check installer/setup.js
          node --check installer/build-unix.js
          node --check installer/online-deps.js
          node --check installer/build-online.js
      - name: Run legacy smoke tests
        run: node tests/smoke.js
      - name: Run v2 smoke tests
        run: node tests/v2.js
      - name: Test two-agent mailbox
        run: node tests/mailbox.js
      - name: Test token-free memory
        run: node tests/memory.js
      - name: Test plan continuity
        run: node tests/plans.js
      - name: Test settings and picker adapter
        shell: bash
        run: |
          node tests/settings.js
          node tests/picker.js
      - name: Test Codex cancellation and child cleanup
        run: node tests/cancel.js
      - name: Test lightweight bootstrap entry points without downloading
        shell: bash
        env:
          CLAUDEBRIDGE_SETUP_TEST_HOME: ${{ runner.temp }}/claudebridge-light-bootstrap-test
        run: |
          if [ "${{ matrix.platform }}" = "win32" ]; then
            cmd.exe /c "installer\\online-windows.cmd --status"
            cmd.exe /c "installer\\online-windows.cmd --uninstall"
          else
            sh installer/online-unix.sh --status
            sh installer/online-unix.sh --uninstall
          fi
      - name: Test one-file installer config registration
        run: node tests/standalone-setup.js
      - name: Bundle Codex CLI runtime
        run: npm install --prefix vendor --no-audit --no-fund --no-save @openai/codex@0.167.0
      - name: Install build-only dependencies
        run: npm install --prefix .builddeps --no-audit --no-fund --no-save @modelcontextprotocol/ext-apps@1.1.2 esbuild@0.25.12 @anthropic-ai/mcpb jsdom@26.1.0
      - name: Build bundled MCP Apps browser UI
        shell: bash
        run: |
          cp ui/client.js .builddeps/claudebridge-ui-entry.js
          npm exec --prefix .builddeps -- esbuild .builddeps/claudebridge-ui-entry.js --bundle --platform=browser --format=iife --minify --outfile=ui/control-panel.bundle.js
      - name: Test interactive MCP panel
        run: node tests/ui.js
      - name: Test native model-picker enhancement
        run: node tests/native-picker.js
      - name: Test native CDP pipe companion
        run: node tests/native-cdp.js
      - name: Test Ripple-lite bootstrap adapter
        run: node tests/ripple-lite.js
      - name: Test Ripple-lite CONNECT transport
        run: node tests/ripple-transport.js
      - name: Test Ripple-lite scoped bootstrap response transform
        run: node tests/ripple-transform.js
      - name: Check bundled Codex CLI
        shell: bash
        run: node vendor/node_modules/@openai/codex/bin/codex.js --version
      - name: Verify on-demand Codex installation into local runtime
        shell: bash
        env:
          CLAUDEBRIDGE_SETUP_TEST_HOME: ${{ runner.temp }}/claudebridge-online-test
          CLAUDEBRIDGE_SETUP_SKIP_NATIVE: '1'
        run: |
          export CLAUDEBRIDGE_NPM_CLI="$(node -e 'const p=require("node:path"),f=require("node:fs"),d=p.dirname(process.execPath);const c=[p.join(d,"node_modules","npm","bin","npm-cli.js"),p.join(d,"..","lib","node_modules","npm","bin","npm-cli.js")];process.stdout.write(c.find(f.existsSync)||"")')"
          if [ ! -f "$CLAUDEBRIDGE_NPM_CLI" ]; then
            echo "Bundled npm CLI not found in CI environment" >&2
            exit 1
          fi
          node installer/online-deps.js install
          test -f "$CLAUDEBRIDGE_SETUP_TEST_HOME/Installed/installer/setup.js"
          node installer/setup.js uninstall
      - name: Validate official MCPB manifest
        shell: bash
        run: npm exec --prefix .builddeps -- mcpb validate manifest.json
      - name: Set manifest platform
        shell: bash
        run: |
          node -e 'const fs=require("fs");const m=require("./manifest.json");m.compatibility.platforms=[process.argv[1]];fs.writeFileSync("manifest.json",JSON.stringify(m,null,2)+"\n")' ${{ matrix.platform }}
      - name: Include user-scoped Windows native picker launcher
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          Copy-Item -LiteralPath (node -p "process.execPath") -Destination "integrations/native-ui/node.exe" -Force
      - name: Include native picker runtime for macOS and Linux
        if: matrix.platform != 'win32'
        shell: bash
        run: |
          cp "$(node -p 'process.execPath')" integrations/native-ui/node
          chmod 700 integrations/native-ui/node
      - name: Verify reversible native picker installation on macOS/Linux
        if: matrix.platform != 'win32'
        shell: bash
        run: node tests/native-install-unix.js
      - name: Verify full macOS/Linux cleanup
        if: matrix.platform != 'win32'
        shell: bash
        run: node tests/cleanup-unix.js
      - name: Test Windows native picker install and rollback
        if: matrix.platform == 'win32'
        shell: pwsh
        run: ./tests/native-install.ps1
      - name: Verify reversible Windows cleanup
        if: matrix.platform == 'win32'
        shell: pwsh
        run: ./tests/cleanup.ps1
      - name: Bundle ClaudeBridge Extension
        shell: pwsh
        run: |
          Compress-Archive -Path manifest.json,server,vendor,ui,integrations,maintenance,installer,claude-plugin -DestinationPath "ClaudeBridge-${{ matrix.label }}.zip" -Force
          # Compress-Archive silently skips hidden dot-directories; explicitly inject
          # the required plugin manifest rather than shipping a broken Claude skill.
          Add-Type -AssemblyName System.IO.Compression
          $archivePath = (Resolve-Path "ClaudeBridge-${{ matrix.label }}.zip").Path
          $zip = [System.IO.Compression.ZipFile]::Open($archivePath, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $manifestPath = (Resolve-Path -LiteralPath "claude-plugin/.claude-plugin/plugin.json").Path
            if ($null -eq $zip.GetEntry("claude-plugin/.claude-plugin/plugin.json")) {
              [void][System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $manifestPath, "claude-plugin/.claude-plugin/plugin.json")
            }
          } finally {
            $zip.Dispose()
          }
          Rename-Item "ClaudeBridge-${{ matrix.label }}.zip" "ClaudeBridge-${{ matrix.label }}.mcpb"
      - name: Verify complete Bridge is embedded and extracts offline
        shell: bash
        run: |
          node installer/build-online.js
          if [ "${{ matrix.platform }}" = "win32" ]; then
            cmd.exe /c "ClaudeBridge-Setup-Windows.cmd --verify-core"
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            sh ClaudeBridge-Setup-macOS.command --verify-core
          else
            sh ClaudeBridge-Setup-Linux.run --verify-core
          fi
      - name: Build Windows single-file Setup.exe
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          dotnet publish installer/windows/ClaudeBridgeSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=none -p:PayloadPath="$((Get-Location).Path)/ClaudeBridge-Windows.mcpb" -o installer/windows/published
          Copy-Item installer/windows/published/ClaudeBridge-Setup-Windows.exe . -Force
      - name: Build macOS/Linux single-file installers
        if: matrix.platform != 'win32'
        run: node installer/build-unix.js
      - name: Test complete all-in-one setup and uninstall
        shell: bash
        env:
          CLAUDEBRIDGE_SETUP_TEST_HOME: ${{ runner.temp }}/claudebridge-setup-end-to-end
          CLAUDEBRIDGE_SETUP_SKIP_NATIVE: '1'
        run: |
          if [ "${{ matrix.platform }}" = "win32" ]; then
            ./ClaudeBridge-Setup-Windows.exe --quiet --install
            ./ClaudeBridge-Setup-Windows.exe --quiet --uninstall
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            ./ClaudeBridge-Setup-macOS.command --install
            ./ClaudeBridge-Setup-macOS.command --uninstall
          else
            ./ClaudeBridge-Setup-Linux.run --install
            ./ClaudeBridge-Setup-Linux.run --uninstall
          fi
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeBridge-${{ matrix.label }}
          path: |
            ClaudeBridge-${{ matrix.label }}.mcpb
            ClaudeBridge-Setup-*
          if-no-files-found: error

  preview-release:
    concurrency:
      group: claudebridge-preview-deploy
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source for the online installer builder
        uses: actions/checkout@v4
      - name: Check current source revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$HEAD" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping outdated preview build."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download all platform packages
        if: steps.current.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: ClaudeBridge-*
          merge-multiple: true
      - name: Build SHA256-pinned lightweight online setup files
        if: steps.current.outputs.publish == 'true'
        run: |
          node installer/build-online.js
          test -s ClaudeBridge-Online-Core.tar.gz
          test -s ClaudeBridge-Setup-Windows.cmd
          test -s ClaudeBridge-Setup-macOS.command
          test -s ClaudeBridge-Setup-Linux.run
          bash -n installer/online-unix.sh
          sh ./ClaudeBridge-Setup-Linux.run --verify-core
          sh ./ClaudeBridge-Setup-macOS.command --verify-core
          node -e 'const f=require("fs"),s=f.readFileSync("ClaudeBridge-Setup-Windows.cmd","utf8"),i=s.lastIndexOf("# CLAUDEBRIDGE CORE PAYLOAD"); if(i<0||Buffer.from(s.slice(i+"# CLAUDEBRIDGE CORE PAYLOAD".length).trim(),"base64").length<10000)process.exit(1);'
      - name: Remove obsolete non-platform preview asset
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete-asset preview ClaudeBridge.mcpb -y 2>/dev/null || true
      - name: Generate SHA-256 checksums
        if: steps.current.outputs.publish == 'true'
        run: sha256sum ClaudeBridge-Setup-Windows.cmd ClaudeBridge-Setup-macOS.command ClaudeBridge-Setup-Linux.run > SHA256SUMS
      - name: Publish preview installers
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view preview >/dev/null 2>&1; then
            gh release upload preview ClaudeBridge-Setup-Windows.cmd ClaudeBridge-Setup-macOS.command ClaudeBridge-Setup-Linux.run SHA256SUMS --clobber
          else
            gh release create preview ClaudeBridge-Setup-Windows.cmd ClaudeBridge-Setup-macOS.command ClaudeBridge-Setup-Linux.run SHA256SUMS --target "$GITHUB_SHA" --title "ClaudeBridge Preview" --notes "Lightweight SHA256-verified online installers for Windows, macOS and Linux. Node.js is downloaded from nodejs.org and Codex CLI from the official npm registry during setup. One-time ChatGPT sign-in required." --prerelease
          fi
          gh release edit preview --title "ClaudeBridge 2.6 — Self-Contained Bridge Setup" --notes "Each installer ALREADY CONTAINS the complete ClaudeBridge server, desktop UI, native model-menu companion and uninstall scripts. Only external dependencies (private Node.js LTS runtime and pinned Codex CLI) download on demand from official providers. Re-running the same setup supports update and uninstall. Native Claude Desktop model-menu integration remains experimental."
          # Remove previously published downloader-only and large offline assets.
          for obsolete in \
            ClaudeBridge-Online-Core.tar.gz ClaudeBridge-WebSetup-Windows.cmd \
            ClaudeBridge-WebSetup-macOS.command ClaudeBridge-WebSetup-Linux.run \
            ClaudeBridge-Linux.mcpb ClaudeBridge-macOS.mcpb ClaudeBridge-Windows.mcpb \
            ClaudeBridge-Setup-Windows.exe; do
            gh release delete-asset preview "$obsolete" -y 2>/dev/null || true
          done
