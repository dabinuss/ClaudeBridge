name: Test and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check server/index.js
      - name: Run MCP smoke tests
        run: node tests/smoke.js
      - name: Validate manifest
        run: node -e "const m=require('./manifest.json'); if(m.display_name!=='ClaudeBridge'||m.server.type!=='node') process.exit(1)"
      - name: Package Desktop Extension
        if: matrix.os == 'ubuntu-latest'
        run: zip -q -r ClaudeBridge.mcpb manifest.json server/
      - name: Upload installable package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeBridge-mcpb
          path: ClaudeBridge.mcpb
          if-no-files-found: error

  preview-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged extension
        uses: actions/download-artifact@v4
        with:
          name: ClaudeBridge-mcpb
      - name: Publish or update preview download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view preview >/dev/null 2>&1; then
            gh release upload preview ClaudeBridge.mcpb --clobber
          else
            gh release create preview ClaudeBridge.mcpb --target "${GITHUB_SHA}" --title "ClaudeBridge Preview" --notes "Automatically built from main after successful Windows, macOS and Linux tests. Experimental: live Claude Desktop login integration is not yet fully verified." --prerelease
          fi
