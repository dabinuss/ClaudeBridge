name: Test and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check server/index.js
      - name: Run MCP smoke tests
        run: node tests/smoke.js
      - name: Validate manifest
        run: node -e "const m=require('./manifest.json'); if(m.display_name!=='ClaudeBridge'||m.server.type!=='node') process.exit(1)"
      - name: Package Desktop Extension
        if: matrix.os == 'ubuntu-latest'
        run: zip -q -r ClaudeBridge.mcpb manifest.json server/
      - name: Upload installable package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeBridge-mcpb
          path: ClaudeBridge.mcpb
          if-no-files-found: error
      - name: Publish tagged release
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ClaudeBridge.mcpb --generate-notes --title "ClaudeBridge ${GITHUB_REF_NAME}"
